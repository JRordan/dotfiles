# terminal + basics
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g renumber-windows on
set -g base-index 0
setw -g pane-base-index 0

# status bar (gruvbox-ish)
set -g status-position top
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 30
set -g status-right-length 50
set -g status-left "#[fg=#282828,bg=#8ec07c,bold]  #S #[fg=#8ec07c,bg=#282828] "
set -g status-right "#[fg=#928374]%H:%M  #[fg=#d3869b]#h "

setw -g window-status-current-style "fg=#282828,bg=#fabd2f,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#928374"
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
